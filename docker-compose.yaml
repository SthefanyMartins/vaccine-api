services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:Z
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vaccine
    depends_on:
      - db

    command: >
      uv run uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --app-dir src

  db:
    image: postgres:17

    container_name: postgres-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaccine

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: